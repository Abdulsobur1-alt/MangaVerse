# ─── MangaVerse — Render Blueprint (free tier, no credit card) ─────
# Deploys the API + web from the monorepo Dockerfiles.
# Requires (all free, no card):
#   • Supabase Postgres  → DATABASE_URL   (Session pooler string, port 5432)
#   • Upstash Redis      → REDIS_URL      (rediss://…, enables the scraper seed)
#   • Supabase Auth      → SUPABASE_URL + SUPABASE_ANON_KEY (API) + NEXT_PUBLIC_SUPABASE_* (web) (optional)
#
# Free-tier realities (see DEPLOYMENT.md → Option C):
#   • Services spin down after 15 min idle (~1 min cold start on next visit).
#   • 750 free instance-hours/month shared across the workspace — two
#     services only accrue hours while awake, so light traffic is fine.
#   • Ephemeral filesystem — nothing persistent on local disk.
#   • No Meilisearch on free tier: search falls back to database queries.

services:
  # ─── API + BullMQ workers ─────────────────────────────────────────
  - type: web
    name: mangaverse-api
    runtime: docker
    plan: free # explicit — Blueprints can otherwise default to a paid tier
    dockerContext: . # repo root — Dockerfiles COPY workspace files
    dockerfilePath: apps/api/Dockerfile
    branch: main
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # Must be the exact web origin (not '*') — the API sets
      # credentials: true, and browsers reject a wildcard origin with
      # credentials. Keep in sync with the web service name below.
      - key: CORS_ORIGIN
        value: https://mangaverse-web.onrender.com
      # ── Fill these in the Render dashboard before the first deploy ──
      # ⚠️ Use the SESSION POOLER URI (Supabase → Connect → Session pooler,
      # host aws-0-<region>.pooler.supabase.com:5432). The direct-connection
      # host (db.<ref>.supabase.co:5432) resolves to IPv6-only and is
      # unreachable from Render → Prisma P1001 "Can't reach database server".
      # On boot the container strips ?pgbouncer=true and runs `prisma db push`
      # to sync the schema through the session pooler (session mode ≈ direct
      # connection). A sync failure is logged but does NOT fail the deploy —
      # the API still comes up and the real DB error shows in the service logs.
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false # Upstash → Database → REST/TLS (rediss://)
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        value: mailto:admin@mangaverse.app
      # ── Supabase Auth (same project as the DB — Settings → API) ──
      # ⚠️ Use the plain Project URL (https://<ref>.supabase.co), NOT the
      # "API URL" shown on the same page — it ends in /rest/v1 and breaks
      # JWT verification (JWKS/issuer would point at /rest/v1/auth/v1). The
      # code strips a trailing /rest/v1 defensively, but keep it clean here.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false

  # ─── Web (Next.js standalone) ─────────────────────────────────────
  - type: web
    name: mangaverse-web
    runtime: docker
    plan: free # explicit — Blueprints can otherwise default to a paid tier
    dockerContext: . # repo root — Dockerfiles COPY workspace files
    dockerfilePath: apps/web/Dockerfile
    branch: main
    autoDeploy: true
    healthCheckPath: /
    envVars:
      # Inlined at build time — keep in sync with the api service name above.
      # ⚠️ Render renames services that collide with an existing name, appending
      # a random suffix (here mangaverse-api → mangaverse-api-cf0o). If this
      # value points at a URL where no service exists, every API call from the
      # web app fails with "CORS: No 'Access-Control-Allow-Origin' header" — the
      # stale URL answers 404 with `x-render-routing: no-server` and no CORS
      # headers. When the api service name changes, update BOTH this value and
      # CORS_ORIGIN above, mirror the values into the dashboard Environment tab,
      # then redeploy the web service (env vars are baked in at build time).
      - key: NEXT_PUBLIC_API_URL
        value: https://mangaverse-api-cf0o.onrender.com/api
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
