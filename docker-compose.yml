services:
  # PostgreSQL 16 — primary database
  postgres:
    image: postgres:16-alpine
    container_name: mangaverse-db
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mangaverse
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis 7 — caching and BullMQ queues
  redis:
    image: redis:7-alpine
    container_name: mangaverse-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  # Meilisearch — full-text search
  meilisearch:
    image: getmeili/meilisearch:v1.12
    container_name: mangaverse-search
    restart: unless-stopped
    ports:
      - '7700:7700'
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-mangaverse-dev-key}
      MEILI_NO_ANALYTICS: 'true'
    volumes:
      - meilisearch_data:/meili_data

  # ─── MangaVerse API — Express + BullMQ workers ────────
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: mangaverse-api
    restart: unless-stopped
    ports:
      - '3001:3001'
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-mangaverse}
      REDIS_URL: redis://redis:6379
      MEILISEARCH_HOST: http://meilisearch:7700
      MEILISEARCH_API_KEY: ${MEILI_MASTER_KEY:-mangaverse-dev-key}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@mangaverse.app}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
    env_file:
      - path: .env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_started

  # ─── MangaVerse Web — Next.js standalone ───────────────
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001/api}
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
    container_name: mangaverse-web
    restart: unless-stopped
    ports:
      - '3000:3000'
    depends_on:
      - api

  # ─── Caddy — reverse proxy + automatic HTTPS ──────────
  caddy:
    image: caddy:2-alpine
    container_name: mangaverse-caddy
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    # DOMAIN reaches Caddy via env_file (root .env). The Caddyfile uses
    # {$DOMAIN:localhost}, so when DOMAIN is absent the fallback applies.
    # Do NOT set DOMAIN to an empty value anywhere (compose ${DOMAIN:-}
    # or an empty line in .env) — Caddy would treat it as defined and
    # the site addresses would break. Leave it out entirely.
    env_file:
      - path: .env
        required: false
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - api

volumes:
  postgres_data:
  redis_data:
  meilisearch_data:
  caddy_data:
  caddy_config:
