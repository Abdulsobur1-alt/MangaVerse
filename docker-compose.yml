services:
  # PostgreSQL 16 — primary database
  postgres:
    image: postgres:16-alpine
    container_name: mangaverse-db
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mangaverse
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis 7 — caching and BullMQ queues
  redis:
    image: redis:7-alpine
    container_name: mangaverse-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  # Meilisearch — full-text search
  meilisearch:
    image: getmeili/meilisearch:v1.12
    container_name: mangaverse-search
    restart: unless-stopped
    ports:
      - '7700:7700'
    environment:
      MEILI_MASTER_KEY: mangaverse-dev-key
      MEILI_NO_ANALYTICS: 'true'
    volumes:
      - meilisearch_data:/meili_data

volumes:
  postgres_data:
  redis_data:
  meilisearch_data:
